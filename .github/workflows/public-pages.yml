name: Publicar privacidad y soporte

on:
  push:
    branches: [main]
    paths:
      - "docs/publishing/privacy.html"
      - "docs/publishing/terms.html"
      - "docs/publishing/support.html"
      - "docs/publishing/index.html"
      - ".github/workflows/public-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar páginas públicas
        run: |
          mkdir public-pages
          cp docs/publishing/index.html public-pages/index.html
          cp docs/publishing/privacy.html public-pages/privacy.html
          cp docs/publishing/terms.html public-pages/terms.html
          cp docs/publishing/support.html public-pages/support.html
          touch public-pages/.nojekyll
      - name: Subir contenido estático
        uses: actions/upload-pages-artifact@v4
        with:
          path: public-pages
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
