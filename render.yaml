services:
  - type: web
    name: warframe-inventory
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    renderSubdomainPolicy: enabled
    autoDeployTrigger: commit
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE
        value: "false"
      - key: WARFRAME_TRACKER_DATABASE_PROVIDER
        value: MySql
      - key: WARFRAME_TRACKER_DB_HOST
        sync: false
      - key: WARFRAME_TRACKER_DB_PORT
        value: "3306"
      - key: WARFRAME_TRACKER_DB_USER
        sync: false
      - key: WARFRAME_TRACKER_DB_PASS
        sync: false
      - key: WARFRAME_TRACKER_DB_NAME
        sync: false
      - key: WARFRAME_TRACKER_DB_SSL_MODE
        # The current cPanel MySQL endpoint advertises TLS but fails its
        # handshake from Linux/OpenSSL. Re-enable Required/VerifyFull only
        # after TLS is correctly configured on the database host.
        value: Disabled
      - key: WARFRAME_TRACKER_DP_CERT_BASE64
        sync: false
      - key: WARFRAME_TRACKER_DP_CERT_PASSWORD
        sync: false
      - key: WARFRAME_TRACKER_APPLY_MIGRATIONS
        value: "1"
